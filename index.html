<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SEIDR — Interactive Portal</title>
<style>
  :root{
    --bg:#0f1a22; --panel:#13202a; --panel-2:#0e1820; --line:#20303b;
    --text:#e9eef2; --muted:#a7b2bb; --teal:#19c5be; --yellow:#f6c947;
    --green:#57d39b; --red:#ef8c7a; --blue:#74aeea; --pink:#ea7ad6;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:linear-gradient(180deg,#0d1820,var(--bg) 35%,#0b141a);color:var(--text);
       font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif}
  a{color:inherit;text-decoration:none}
  .app{display:grid;grid-template-columns:320px 1fr;gap:0;min-height:100vh}
  .sidebar{background:rgba(15,26,34,.9);border-right:1px solid var(--line);backdrop-filter:saturate(120%) blur(6px);display:flex;flex-direction:column}
  .brand{display:flex;align-items:center;gap:10px;padding:16px 16px;border-bottom:1px solid var(--line)}
  .brand b{font-size:18px}
  .search{padding:12px 14px;border-bottom:1px solid var(--line)}
  .search input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--text)}
  .nav{padding:10px 8px;overflow:auto}
  .group{margin:10px 8px 6px;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
  .item{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:6px 6px;border-radius:10px;border:1px solid transparent;cursor:pointer}
  .item:hover{background:rgba(25,197,190,.06);border-color:var(--line)}
  .item.active{background:rgba(25,197,190,.12);border-color:#2a6a67}
  .tag{margin-left:auto;font-size:11px;padding:2px 6px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted)}
  .main{display:grid;grid-template-rows:auto 1fr}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:rgba(15,26,34,.9);backdrop-filter:saturate(120%) blur(6px)}
  .leftact{display:flex;align-items:center;gap:10px}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);font-size:12px}
  .btn{border:1px solid var(--line);background:var(--panel-2);color:var(--text);padding:8px 12px;border-radius:10px;font-weight:700;cursor:pointer}
  .btn:hover{filter:brightness(1.06)}
  .stage-wrap{position:relative}
  .hint{position:absolute;right:12px;top:12px;background:rgba(14,24,32,.9);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--muted)}
  iframe{width:100%;height:calc(100vh - 54px);border:0;display:block;background:#0c141a}
  .footer{font-size:12px;color:var(--muted);padding:10px 12px;border-top:1px solid var(--line)}
  .kbd{border:1px solid var(--line);padding:1px 6px;border-radius:6px;background:#0e1820;color:var(--muted);font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace}
  @media (max-width:1100px){ .app{grid-template-columns:1fr} .sidebar{position:fixed;inset:0 40% 0 0;z-index:30;transform:translateX(-100%);transition:transform .2s ease} .sidebar.show{transform:translateX(0%)} .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20} .overlay.show{display:block} }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="var(--teal)" stroke-width="2"/><path d="M5 13h14M8 9h8" stroke="var(--teal)" stroke-width="2"/></svg>
      <b>SEIDR Portal</b>
    </div>
    <div class="search">
      <input id="q" placeholder="Quick find (⌘/Ctrl K)…" autocomplete="off"/>
    </div>
    <div class="nav" id="nav"></div>
    <div class="footer">Tip: Press <span class="kbd">⌘/Ctrl</span> + <span class="kbd">K</span> to search. Use the left menu to switch pages.</div>
  </aside>

  <div class="overlay" id="overlay"></div>

  <main class="main">
    <div class="topbar">
      <div class="leftact">
        <button class="btn" id="menuBtn" title="Toggle menu">☰</button>
        <span class="pill" id="crumb">Welcome</span>
      </div>
      <div class="leftact">
        <button class="btn" id="openNew" title="Open current page in a new tab">Open in new tab ↗</button>
      </div>
    </div>
    <div class="stage-wrap">
      <div class="hint">Some embedded pages include their own top bar. Use the left menu to navigate between tools.</div>
      <iframe id="stage" name="stage" src="about:blank" allow="clipboard-read; clipboard-write"></iframe>
    </div>
  </main>
</div>

<script>
const PAGES = [
  { id:'projectbuilder', title:'Project Builder — Layout & Process', file:'projectbuilder.html', tags:['layout','process','site','map'] },
  { id:'comparison', title:'Gatekeeper — Portfolio Board & Scoring', file:'comparison.html', tags:['portfolio','screening','gatekeeper'] },
  { id:'ESIA3', title:'Environmental & Social Impact Screening (NO)', file:'ESIA3.html', tags:['esia','environment','social','screening'] },
  { id:'CAPEX', title:'CAPEX Workbench', file:'CAPEX.html', tags:['capex','cost','estimate','wbs'] },
  { id:'OEMcomparison', title:'Electrolyzer Config Comparison', file:'OEMcomparison.html', tags:['electrolyzer','lcoh','benchmark'] },
  { id:'offtake', title:'Off-take Integration Studies', file:'offtake.html', tags:['pipeline','trucks','port','offtake'] },
  { id:'LLI5', title:'Long Lead Items (LLI)', file:'LLI5.html', tags:['procurement','vendors','lead time'] },
  { id:'schedule', title:'Project Schedule & Critical Path', file:'schedule.html', tags:['gantt','critical path','monte carlo'] },
  { id:'screening_result', title:'No-Go Review (Meråker)', file:'Screening_Result.html', tags:['review','blockers','no-go'] },
];

const nav = document.getElementById('nav');
const stage = document.getElementById('stage');
const crumb = document.getElementById('crumb');
const openNew = document.getElementById('openNew');
const q = document.getElementById('q');
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');
const menuBtn = document.getElementById('menuBtn');

// Render navigation list
function renderList(filter=''){
  nav.innerHTML = '';
  const term = filter.trim().toLowerCase();
  const filtered = PAGES.filter(p => !term || p.title.toLowerCase().includes(term) || p.tags.some(t=>t.includes(term)));
  if(filtered.length === 0){
    const d = document.createElement('div'); d.style.padding='10px 14px'; d.style.color='var(--muted)';
    d.textContent = 'No matches.'; nav.appendChild(d); return;
  }
  const groupTitle = document.createElement('div');
  groupTitle.className = 'group'; groupTitle.textContent = 'Tools & Boards';
  nav.appendChild(groupTitle);
  filtered.forEach(p=>{
    const a = document.createElement('a'); a.href = '#'+p.id; a.dataset.id=p.id;
    const item = document.createElement('div'); item.className='item'; item.id='item-'+p.id;
    const icon = document.createElementNS('http://www.w3.org/2000/svg','svg'); icon.setAttribute('width','16'); icon.setAttribute('height','16'); icon.setAttribute('viewBox','0 0 24 24');
    icon.innerHTML = '<path d="M4 7h16M4 12h16M4 17h16" stroke="var(--teal)" stroke-width="2"/>';
    const span = document.createElement('span'); span.textContent = p.title;
    const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = p.tags[0];
    item.appendChild(icon); item.appendChild(span); item.appendChild(tag);
    a.appendChild(item);
    nav.appendChild(a);
  });
  highlightActive(getCurrentId());
}
renderList();

function getCurrentId(){
  const h = location.hash.replace('#','');
  const exists = PAGES.some(p=>p.id===h);
  return exists? h : (localStorage.getItem('seidr_last') || 'projectbuilder');
}

function loadPage(id, pushHash=true){
  const p = PAGES.find(x=>x.id===id) || PAGES[0];
  crumb.textContent = p.title;
  stage.src = p.file;
  localStorage.setItem('seidr_last', p.id);
  if(pushHash) location.hash = p.id;
  openNew.onclick = () => window.open(p.file, '_blank');
  highlightActive(p.id);
  // On mobile, close sidebar after selection
  sidebar.classList.remove('show'); overlay.classList.remove('show');
}

function highlightActive(id){
  document.querySelectorAll('.item').forEach(el=>el.classList.remove('active'));
  const cur = document.getElementById('item-'+id);
  if(cur) cur.classList.add('active');
}

window.addEventListener('hashchange', ()=> loadPage(getCurrentId(), false));

// Quick find
q.addEventListener('input', e => renderList(e.target.value));

// Keyboard shortcut ⌘/Ctrl K to focus search
window.addEventListener('keydown', (e)=>{
  const isMac = navigator.platform.toUpperCase().indexOf('MAC')>=0;
  if((isMac && e.metaKey && e.key.toLowerCase()==='k') || (!isMac && e.ctrlKey && e.key.toLowerCase()==='k')){
    e.preventDefault(); q.focus(); q.select();
  }
});

// Mobile menu toggle
menuBtn.addEventListener('click', ()=>{
  sidebar.classList.toggle('show'); overlay.classList.toggle('show');
});
overlay.addEventListener('click', ()=>{ sidebar.classList.remove('show'); overlay.classList.remove('show'); });

// Initial load
loadPage(getCurrentId(), false);

// Try to gently neutralize "Back" links inside embedded pages so they open the portal instead of inside iframe
stage.addEventListener('load', ()=>{
  try{
    const doc = stage.contentDocument;
    if(!doc) return;
    // Add a base tag so links with target=_parent go full page if authors used it
    let base = doc.querySelector('base');
    if(!base){ base = doc.createElement('base'); doc.head.appendChild(base); }
    base.setAttribute('target','_parent');
  }catch(err){ /* cross-origin or other issues; ignore */ }
});
</script>
</body>
</html>
