<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SEIDR — Pro Portal</title>
<style>
:root{
  --bg:#0f1a22; --panel:#13202a; --panel-2:#0e1820; --line:#20303b;
  --text:#e9eef2; --muted:#a7b2bb; --teal:#19c5be; --ok:#57d39b;
}
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;background:linear-gradient(180deg,#0d1820,var(--bg) 35%,#0b141a);color:var(--text);
     font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif}
.app{display:grid;grid-template-columns:320px 1fr;min-height:100vh}
.sidebar{background:rgba(15,26,34,.9);border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px;border-bottom:1px solid var(--line)}
.brand b{font-size:18px}
.search{padding:12px 14px;border-bottom:1px solid var(--line)}
.search input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--text)}
.nav{padding:10px 8px;overflow:auto}
.group{margin:10px 8px 6px;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:6px 6px;border-radius:10px;border:1px solid transparent;cursor:pointer}
.item:hover{background:rgba(25,197,190,.06);border-color:var(--line)}
.item.active{background:rgba(25,197,190,.12);border-color:#2a6a67}
.tag{margin-left:auto;font-size:11px;padding:2px 6px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted)}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:rgba(15,26,34,.9);backdrop-filter:saturate(120%) blur(6px)}
.btn{border:1px solid var(--line);background:var(--panel-2);color:var(--text);padding:8px 12px;border-radius:10px;font-weight:700;cursor:pointer}
.stage{position:relative;background:#0c141a;min-height:0}
.deck{position:relative;height:calc(100vh - 54px)}
.page{position:absolute;inset:0;opacity:0;transform:translateY(8px) scale(.995);
       transition:opacity .28s ease, transform .32s ease;pointer-events:none}
.page.show{opacity:1;transform:none;pointer-events:auto}
.page.enter{opacity:0;transform:translateY(8px) scale(.995)}
.page.exit{opacity:0;transform:translateY(-6px) scale(.997)}
iframe{width:100%;height:100%;border:0;background:#0c141a}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--muted)}
.spinner{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--teal);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{font-size:12px;color:var(--muted);padding:10px 12px;border-top:1px solid var(--line)}
.kbd{border:1px solid var(--line);padding:1px 6px;border-radius:6px;background:#0e1820;color:var(--muted);font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace}
@media (max-width:1100px){ .app{grid-template-columns:1fr} .sidebar{position:fixed;inset:0 40% 0 0;z-index:30;transform:translateX(-100%);transition:transform .2s ease} .sidebar.show{transform:translateX(0%)} .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20} .overlay.show{display:block} }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><b>SEIDR Portal</b></div>
    <div class="search"><input id="q" placeholder="Quick find (⌘/Ctrl K) …" autocomplete="off" /></div>
    <div class="nav" id="nav"></div>
    <div class="footer">Tip: <span class="kbd">⌘/Ctrl</span>+<span class="kbd">K</span> to search. Back/forward works.</div>
  </aside>
  <div class="overlay" id="overlay"></div>

  <main class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:8px">
        <button class="btn" id="menuBtn">☰</button>
        <span id="crumb">Welcome</span>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn" id="openNew">Open in new tab ↗</button>
        <button class="btn" id="reload">Reload tool ⟳</button>
      </div>
    </div>
    <section class="stage">
      <div id="deck" class="deck"></div>
    </section>
  </main>
</div>

<script>
const PAGES = [{"id": "projectbuilder", "title": "Project Builder \u2014 Layout & Process", "file": "projectbuilder.html", "tag": "layout"}, {"id": "comparison", "title": "Gatekeeper \u2014 Portfolio Board & Scoring", "file": "comparison.html", "tag": "portfolio"}, {"id": "ESIA3", "title": "Environmental & Social Impact Screening (NO)", "file": "ESIA3.html", "tag": "esia"}, {"id": "CAPEX", "title": "CAPEX Workbench", "file": "CAPEX.html", "tag": "capex"}, {"id": "OEMcomparison", "title": "Electrolyzer Config Comparison", "file": "OEMcomparison.html", "tag": "electrolyzer"}, {"id": "offtake", "title": "Off\u2011take Integration Studies", "file": "offtake.html", "tag": "pipeline"}, {"id": "LLI5", "title": "Long Lead Items (LLI)", "file": "LLI5.html", "tag": "procurement"}, {"id": "schedule", "title": "Project Schedule & Critical Path", "file": "schedule.html", "tag": "gantt"}, {"id": "screening_result", "title": "No\u2011Go Review (Mer\u00e5ker)", "file": "Screening_Result.html", "tag": "review"}];

const deck = document.getElementById('deck');
const nav = document.getElementById('nav');
const crumb = document.getElementById('crumb');
const q = document.getElementById('q');
const openNew = document.getElementById('openNew');
const reloadBtn = document.getElementById('reload');
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');
const menuBtn = document.getElementById('menuBtn');

// Build nav
function renderNav(filter=''){
  nav.innerHTML = '';
  const term = filter.trim().toLowerCase();
  const list = PAGES.filter(p => !term || p.title.toLowerCase().includes(term) || p.tag.includes(term));
  const group = document.createElement('div'); group.className='group'; group.textContent='Tools & Boards'; nav.appendChild(group);
  list.forEach(p=>{
    const a = document.createElement('a'); a.href = '#'+p.id; a.dataset.id=p.id;
    const item = document.createElement('div'); item.className='item'; item.id='item-'+p.id;
    const span = document.createElement('span'); span.textContent = p.title;
    const tag = document.createElement('span'); tag.className='tag'; tag.textContent = p.tag;
    item.appendChild(span); item.appendChild(tag); a.appendChild(item); nav.appendChild(a);
  });
}
renderNav();

// Build deck with preloaded iframes
PAGES.forEach(p=>{
  const page = document.createElement('div'); page.className='page'; page.id='page-'+p.id;
  const loader = document.createElement('div'); loader.className='loading'; loader.innerHTML = '<div class="spinner"></div><span>Loading…</span>'; page.appendChild(loader);
  const ifr = document.createElement('iframe'); ifr.src = p.file; ifr.dataset.id = p.id;
  ifr.addEventListener('load', ()=> loader.remove(), {{once:true}});
  page.appendChild(ifr);
  deck.appendChild(page);
});

function getCurrentId(){
  const h = location.hash.replace('#','');
  const exists = PAGES.some(p=>p.id===h);
  return exists? h : (localStorage.getItem('seidr_last_pro') || PAGES[0].id);
}

let current = null;
function show(id, push=true){
  const p = PAGES.find(x=>x.id===id) || PAGES[0];
  const nextEl = document.getElementById('page-'+p.id);
  if(!nextEl) return;
  crumb.textContent = p.title;
  localStorage.setItem('seidr_last_pro', p.id);
  if(push) location.hash = p.id;

  // open in new tab and reload actions
  openNew.onclick = () => window.open(p.file,'_blank');
  reloadBtn.onclick = () => {
    const iframe = nextEl.querySelector('iframe');
    iframe.contentWindow.location.reload();
  };

  // transitions
  const prevEl = current && document.getElementById('page-'+current);
  if(prevEl && prevEl!==nextEl){
    prevEl.classList.remove('show');
    prevEl.classList.add('exit');
    setTimeout(()=> prevEl.classList.remove('exit'), 320);
  }
  nextEl.classList.add('enter');
  requestAnimationFrame(()=>{
    nextEl.classList.add('show');
    nextEl.classList.remove('enter');
  });
  current = p.id;

  // highlight nav
  document.querySelectorAll('.item').forEach(el=>el.classList.remove('active'));
  const cur = document.getElementById('item-'+p.id);
  if(cur) cur.classList.add('active');

  // mobile: close
  sidebar.classList.remove('show'); overlay.classList.remove('show');
}

window.addEventListener('hashchange', ()=> show(getCurrentId(), false));

// Quick find
q.addEventListener('input', e => renderNav(e.target.value));

// Keyboard shortcut ⌘/Ctrl + K
window.addEventListener('keydown', (e)=>{
  const isMac = navigator.platform.toUpperCase().includes('MAC');
  if((isMac && e.metaKey && e.key.toLowerCase()==='k') || (!isMac && e.ctrlKey && e.key.toLowerCase()==='k')){
    e.preventDefault(); q.focus(); q.select();
  }
});

// Mobile menu
menuBtn.addEventListener('click', ()=>{ sidebar.classList.toggle('show'); overlay.classList.toggle('show'); });
overlay.addEventListener('click', ()=>{ sidebar.classList.remove('show'); overlay.classList.remove('show'); });

// Initial
show(getCurrentId(), false);
</script>
</body>
</html>
