<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SEIDR — Pro Portal (Inline)</title>
<style>
:root{ --bg:#0f1a22; --panel:#13202a; --panel-2:#0e1820; --line:#20303b; --text:#e9eef2; --muted:#a7b2bb; --teal:#19c5be; }
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;background:linear-gradient(180deg,#0d1820,var(--bg) 35%,#0b141a);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif}
.app{display:grid;grid-template-columns:320px 1fr;min-height:100vh}
.sidebar{background:rgba(15,26,34,.9);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px;border-bottom:1px solid var(--line)}
.search{padding:12px 14px;border-bottom:1px solid var(--line)}
.search input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--text)}
.nav{padding:10px 8px;overflow:auto}
.group{margin:10px 8px 6px;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:6px 6px;border-radius:10px;border:1px solid transparent;cursor:pointer}
.item:hover{background:rgba(25,197,190,.06);border-color:var(--line)}
.item.active{background:rgba(25,197,190,.12);border-color:#2a6a67}
.tag{margin-left:auto;font-size:11px;padding:2px 6px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted)}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:rgba(15,26,34,.9)}
.btn{border:1px solid var(--line);background:var(--panel-2);color:var(--text);padding:8px 12px;border-radius:10px;font-weight:700;cursor:pointer}
.stage{position:relative;background:#0c141a}
.deck{position:relative;height:calc(100vh - 54px)}
.page{position:absolute;inset:0;opacity:0;transform:translateY(8px) scale(.995);
       transition:opacity .28s ease, transform .32s ease;pointer-events:none}
.page.show{opacity:1;transform:none;pointer-events:auto}
iframe{width:100%;height:100%;border:0;background:#0c141a}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><b>SEIDR Portal</b></div>
    <div class="search"><input id="q" placeholder="Quick find (⌘/Ctrl K) …" autocomplete="off" /></div>
    <div class="nav" id="nav"></div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:8px"><span id="crumb">Welcome</span></div>
      <div style="display:flex;gap:8px">
        <button class="btn" id="openNew">Open in new tab ↗</button>
      </div>
    </div>
    <section class="stage"><div id="deck" class="deck"></div></section>
  </main>
</div>

const nav = document.getElementById('nav');
const crumb = document.getElementById('crumb');
const q = document.getElementById('q');
const openNew = document.getElementById('openNew');

function renderNav(filter=''){
  nav.innerHTML = '';
  const term = filter.trim().toLowerCase();
  const list = PAGES.filter(p => !term || p.title.toLowerCase().includes(term) || p.tag.includes(term));
  const group = document.createElement('div'); group.className='group'; group.textContent='Tools & Boards'; nav.appendChild(group);
  list.forEach(p=>{
    const a = document.createElement('a'); a.href = '#'+p.id; a.dataset.id=p.id;
    const item = document.createElement('div'); item.className='item'; item.id='item-'+p.id;
    const span = document.createElement('span'); span.textContent = p.title;
    const tag = document.createElement('span'); tag.className='tag'; tag.textContent = p.tag;
    item.appendChild(span); item.appendChild(tag); a.appendChild(item); nav.appendChild(a);
  });
}
renderNav();

// Preload iframes with srcdoc (base64 decoded)
PAGES.forEach(p=>{
  const page = document.createElement('div'); page.className='page'; page.id='page-'+p.id;
  const ifr = document.createElement('iframe');
  const html = new TextDecoder('utf-8').decode(Uint8Array.from(atob(INLINE[p.id]), c => c.charCodeAt(0)));
  ifr.srcdoc = html;
  page.appendChild(ifr);
  deck.appendChild(page);
});

function getCurrentId(){
  const h = location.hash.replace('#','');
  const exists = PAGES.some(p=>p.id===h);
  return exists? h : (localStorage.getItem('seidr_last_pro_inline') || PAGES[0].id);
}

let current = null;
function show(id, push=true){
  const p = PAGES.find(x=>x.id===id) || PAGES[0];
  const nextEl = document.getElementById('page-'+p.id);
  if(!nextEl) return;
  crumb.textContent = p.title;
  localStorage.setItem('seidr_last_pro_inline', p.id);
  if(push) location.hash = p.id;

  const prevEl = current && document.getElementById('page-'+current);
  if(prevEl && prevEl!==nextEl){ prevEl.classList.remove('show'); }
  nextEl.classList.add('show');
  current = p.id;

  document.querySelectorAll('.item').forEach(el=>el.classList.remove('active'));
  const cur = document.getElementById('item-'+p.id); if(cur) cur.classList.add('active');

  openNew.onclick = () => {
    const html = new TextDecoder('utf-8').decode(Uint8Array.from(atob(INLINE[p.id]), c => c.charCodeAt(0)));
    const blob = new Blob([html], {type:'text/html'});
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
  };
}

window.addEventListener('hashchange', ()=> show(getCurrentId(), false));
q.addEventListener('input', e => renderNav(e.target.value));

// Initial
show(getCurrentId(), false);
</script>
